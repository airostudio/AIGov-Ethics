<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="20"/>

  <!-- Connection Lines -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.5">
    <!-- Central to outer connections -->
    <line x1="400" y1="300" x2="200" y2="150"/>
    <line x1="400" y1="300" x2="600" y2="150"/>
    <line x1="400" y1="300" x2="200" y2="450"/>
    <line x1="400" y1="300" x2="600" y2="450"/>
    <!-- Outer to outer connections -->
    <line x1="200" y1="150" x2="600" y2="150" stroke-dasharray="5,5"/>
    <line x1="200" y1="450" x2="600" y2="450" stroke-dasharray="5,5"/>
    <line x1="200" y1="150" x2="200" y2="450" stroke-dasharray="5,5"/>
    <line x1="600" y1="150" x2="600" y2="450" stroke-dasharray="5,5"/>
  </g>

  <!-- Central Node: AI Governance -->
  <g filter="url(#glow)">
    <circle cx="400" cy="300" r="80" fill="url(#nodeGrad1)" opacity="0.9"/>
    <circle cx="400" cy="300" r="80" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  </g>
  <text x="400" y="290" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">AI</text>
  <text x="400" y="312" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Governance</text>

  <!-- Node 1: Ethics -->
  <g filter="url(#glow)">
    <circle cx="200" cy="150" r="55" fill="url(#nodeGrad2)" opacity="0.9"/>
  </g>
  <text x="200" y="155" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Ethics</text>

  <!-- Node 2: Compliance -->
  <g filter="url(#glow)">
    <circle cx="600" cy="150" r="55" fill="url(#nodeGrad3)" opacity="0.9"/>
  </g>
  <text x="600" y="155" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Compliance</text>

  <!-- Node 3: Risk -->
  <g filter="url(#glow)">
    <circle cx="200" cy="450" r="55" fill="url(#nodeGrad3)" opacity="0.9"/>
  </g>
  <text x="200" y="455" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Risk</text>

  <!-- Node 4: Operations -->
  <g filter="url(#glow)">
    <circle cx="600" cy="450" r="55" fill="url(#nodeGrad2)" opacity="0.9"/>
  </g>
  <text x="600" y="455" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Operations</text>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="700" cy="100" r="5" fill="#14b8a6" opacity="0.5"/>
  <circle cx="100" cy="500" r="5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="700" cy="500" r="5" fill="#3b82f6" opacity="0.5"/>

  <!-- Small floating elements -->
  <circle cx="300" cy="200" r="3" fill="white" opacity="0.3"/>
  <circle cx="500" cy="200" r="3" fill="white" opacity="0.3"/>
  <circle cx="300" cy="400" r="3" fill="white" opacity="0.3"/>
  <circle cx="500" cy="400" r="3" fill="white" opacity="0.3"/>
</svg>
